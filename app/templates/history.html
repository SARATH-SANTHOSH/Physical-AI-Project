<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History - LoRa Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .navbar, .card { background-color: #1e293b; border-bottom: 1px solid #334155; }
        .table-dark { background-color: #1e293b; }
        .anomaly-row { background-color: #450a0a !important; color: #fca5a5; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 mb-4">
        <a class="navbar-brand text-info fw-bold" href="/">📡 UNO Q Gateway</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Live Monitor</a>
            <a class="nav-link active" href="/history">History</a>
            <a class="nav-link" href="/analytics">Analytics</a>
            <a class="nav-link text-danger ms-3" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card p-3">
            <h5 class="mb-3">Historical Records & ML Anomaly Logs</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Raw Payload</th>
                            <th>Type</th>
                            <th>Parsed Content</th>
                            <th>RSSI / SNR</th>
                            <th>ML Anomaly Reason</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const res = await fetch('/api/history_all');
            const data = await res.json();
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';
            
            data.reverse().forEach(r => {
                const tr = document.createElement('tr');
                if (r.is_anomaly) tr.className = 'anomaly-row';
                tr.innerHTML = `
                    <td>${r.timestamp}</td>
                    <td><code>${r.raw_payload}</code></td>
                    <td><span class="badge bg-secondary">${r.data_type}</span></td>
                    <td>${JSON.stringify(r.parsed)}</td>
                    <td>${r.rssi} dBm / ${r.snr} dB</td>
                    <td>${r.is_anomaly ? '🚨 ' + r.anomaly_reason : 'OK'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        loadHistory();
    </script>
</body>
</html>
