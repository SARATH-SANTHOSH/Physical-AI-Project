<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - UNO Q Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 mb-4">
        <a class="navbar-brand text-info fw-bold" href="/">📡 UNO Q Gateway</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/">Live Monitor</a>
            <a class="nav-link" href="/history">History</a>
            <a class="nav-link" href="/analytics">Analytics</a>
            <a class="nav-link text-danger ms-3" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card p-3">
                    <small class="text-secondary">Last Payload</small>
                    <h4 id="lblPayload" class="text-warning mt-1">--</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <small class="text-secondary">Data Type</small>
                    <h4 id="lblType" class="text-info mt-1">--</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <small class="text-secondary">Signal (RSSI / SNR)</small>
                    <h4 id="lblSignal" class="text-success mt-1">--</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <small class="text-secondary">Isolation Forest ML Status</small>
                    <h4 id="lblStatus" class="text-light mt-1">Normal</h4>
                    <small id="lblReason" class="text-muted">No active flags</small>
                </div>
            </div>
        </div>

        <div class="card p-3 mb-4">
            <h5>Real-Time Telemetry Trend</h5>
            <canvas id="liveChart" height="70"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Temperature (°C)', data: [], borderColor: '#f43f5e', tension: 0.3 },
                    { label: 'Humidity (%)', data: [], borderColor: '#38bdf8', tension: 0.3 }
                ]
            },
            options: { scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
        });

        async function updateData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            if (data.length === 0) return;

            const latest = data[0];
            document.getElementById('lblPayload').innerText = latest.raw_payload;
            document.getElementById('lblType').innerText = latest.data_type;
            document.getElementById('lblSignal').innerText = `${latest.rssi} dBm / ${latest.snr} dB`;
            
            const status = document.getElementById('lblStatus');
            const reason = document.getElementById('lblReason');
            status.innerText = latest.is_anomaly ? "⚠️ ML ANOMALY" : "✅ Normal";
            status.className = latest.is_anomaly ? "text-danger fw-bold mt-1" : "text-success mt-1";
            reason.innerText = latest.anomaly_reason;

            const chartData = data.slice(0, 20).reverse();
            chart.data.labels = chartData.map(d => d.timestamp.split(' ')[1]);
            chart.data.datasets[0].data = chartData.map(d => d.parsed.temperature || null);
            chart.data.datasets[1].data = chartData.map(d => d.parsed.humidity || null);
            chart.update();
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
